[package]
name = "tdb"
version = "0.1.0"
edition = "2021"
description = "Full-screen terminal database manager (Rust rewrite of TDB)"

[[bin]]
name = "tdb"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"
unicode-segmentation = "1"

# async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
tokio-util = "0.7"
futures = "0.3"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# crypto (compatible with the Go AES-256-GCM + 120k-round SHA256 vault)
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

# util
anyhow = "1"
thiserror = "2"
regex = "1"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }

# database drivers (optional features keep the dev build fast until wired in)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "chrono", "bigdecimal", "rust_decimal"], optional = true }
redis = { version = "0.27", features = ["tokio-comp"], optional = true }
mongodb = { version = "3", optional = true }
bson = { version = "2", optional = true }

[features]
default = ["drivers"]
drivers = ["dep:sqlx", "dep:redis", "dep:mongodb", "dep:bson"]

[dev-dependencies]
tempfile = "3"
